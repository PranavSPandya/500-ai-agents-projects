<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTA VI Countdown Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/widget.css" />
</head>
<body>
  <div class="widget">
    <div class="widget-header">
      <span class="widget-logo">GTA</span>
      <span class="widget-vi">VI</span>
    </div>
    <div class="widget-countdown" id="widget-countdown">
      <div class="w-unit"><span class="w-val" id="w-days">000</span><span class="w-lbl">Days</span></div>
      <span class="w-sep">:</span>
      <div class="w-unit"><span class="w-val" id="w-hours">00</span><span class="w-lbl">Hrs</span></div>
      <span class="w-sep">:</span>
      <div class="w-unit"><span class="w-val" id="w-mins">00</span><span class="w-lbl">Min</span></div>
      <span class="w-sep">:</span>
      <div class="w-unit"><span class="w-val" id="w-secs">00</span><span class="w-lbl">Sec</span></div>
    </div>
    <p class="widget-date">Nov 19, 2026 · PS5 &amp; Xbox</p>
  </div>
  <script src="js/widget.js"></script>
</body>
</html>
